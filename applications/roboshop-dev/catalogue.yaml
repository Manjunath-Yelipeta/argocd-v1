apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-lbc
  namespace: argocd
  # The finalizer enables cascading deletes (deleting this app deletes its resources)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # The Argo CD project this application belongs to
  project: default

  source:
    chart: aws-load-balancer-controller
    repoURL: https://github.com/daws-90s/catalogue-config.git
    targetRevision: main # chart-version
    path: .
    helm:
      # --set
      valueFiles:
      - values-dev.yaml
      - values.yaml
  # Destination configuration pointing to the target cluster and namespace
  destination:
    server: https://kubernetes.default.svc
    namespace: roboshop-dev

  syncPolicy:
    automated:
      prune: true       # Automatically deletes resources no longer in Git
      selfHeal: true  